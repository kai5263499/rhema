name: Tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Install audio test dependencies
        run: |
          sudo apt-get update > /tmp/apt-update.log 2>&1 || { cat /tmp/apt-update.log; exit 1; }
          sudo apt-get install --no-install-recommends -y lame espeak-ng espeak-ng-data ffmpeg sox libsox-fmt-mp3 > /tmp/apt-install.log 2>&1 || { cat /tmp/apt-install.log; exit 1; }
      - name: Install API code generator
        run: go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@v1.12.4
      - name: Generate API bindings from the checked-in specification
        run: go generate ./internal/v1
      - name: Resolve missing API runtime requirements for review
        run: go get github.com/deepmap/oapi-codegen/pkg/runtime@v1.12.4 github.com/getkin/kin-openapi/openapi3@v0.107.0
      - name: Download dependencies
        run: go mod download
      - name: Verify dependency integrity
        run: go mod verify
      - name: Run all package tests
        run: go test -count=1 -timeout=15m ./...
      - name: Check module metadata is committed
        if: always()
        run: git diff --exit-code -- go.mod go.sum
